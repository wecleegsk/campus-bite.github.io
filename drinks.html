<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS BITE | DRINKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #090b0e; --panel-bg: #13171c; --accent-gold: #ffb703; --text-white: #ffffff; --text-muted: #64748b; --glass-border: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: rgba(19,23,28,0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); }
        .logo { font-size: 1.2rem; font-weight: 800; } .logo span { color: var(--accent-gold); }
        .tagline { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 8px 14px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
        #cartIcon { background: var(--accent-gold); color: #090b0e !important; position: relative; }
        #cartCount { background: white; color: black; font-size: 0.7rem; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-left: 5px; font-weight: 800; }
        .category-bar { background: rgba(19,23,28,0.5); border-bottom: 1px solid var(--glass-border); padding: 12px 0; display: flex; justify-content: center; }
        .category-switcher { display: flex; gap: 12px; list-style: none; }
        .category-switcher a { color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 0.8rem; padding: 8px 20px; border-radius: 99px; border: 1px solid var(--glass-border); }
        .category-switcher a.active { color: var(--bg-dark); background: var(--accent-gold); }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 50px 24px; width: 100%; flex-grow: 1; }
        .hero-titles { text-align: center; margin-bottom: 45px; }
        .hero-titles h4 { color: var(--accent-gold); letter-spacing: 3px; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 8px; }
        .hero-titles h2 { font-size: 2.8rem; font-weight: 800; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
        .card { background: var(--panel-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); display: flex; flex-direction: column; }
        .image-frame { position: relative; padding-top: 85%; overflow: hidden; background: rgba(0,0,0,0.15); }
        .card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .price-tag { color: var(--accent-gold); font-weight: 800; font-size: 1.15rem; }
        .add-cart-btn { background: var(--accent-gold); color: #090b0e; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 8px; }
        .whatsapp-btn { background: rgba(255,255,255,0.03); color: white; text-decoration: none; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--glass-border); display: block; }
        #cartDrawer { position: fixed; top: 0; right: -400px; width: 360px; max-width: 90vw; height: 100vh; background: #13171c; border-left: 1px solid var(--glass-border); z-index: 2000; transition: right 0.3s ease; display: flex; flex-direction: column; padding: 20px; }
        #cartDrawer.open { right: 0; }
        #cartOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 1999; }
        #cartOverlay.open { display: block; }
        footer { text-align: center; padding: 40px; border-top: 1px solid var(--glass-border); color: var(--text-muted); margin-top: 60px; }
    </style>
</head>
<body>
    <header>
        <div><div class="logo">CAMPUS <span>BITE</span></div><div class="tagline">Our vision to satisfy your cravings</div></div>
        <nav class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a id="cartIcon"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount">0</span></a>
        </nav>
    </header>
    <div class="category-bar">
        <ul class="category-switcher"><li><a href="index.html">Kota</a></li><li><a href="drinks.html" class="active">Drinks</a></li></ul>
    </div>
    <main class="main-container">
        <div class="hero-titles"><h4>Welcome to Campus Bite</h4><h2>Chilled Refreshments</h2></div>
        <div class="menu-grid">
            <div class="card"><div class="image-frame"><img src="images (19).jpeg"></div><div class="card-details"><div class="info-row"><h6>Lemon Twist</h6><span class="price-tag">R22.00</span></div><button class="add-cart-btn" onclick="addToCart('Lemon Twist',22)">Add to Cart</button><a href="https://wa.me/27790155149?text=Lemon Twist" class="whatsapp-btn">Quick Order</a></div></div>
            <div class="card"><div class="image-frame"><img src="images (18).jpeg"></div><div class="card-details"><div class="info-row"><h6>Sprite</h6><span class="price-tag">R25.00</span></div><button class="add-cart-btn" onclick="addToCart('Sprite',25)">Add to Cart</button><a href="https://wa.me/27790155149?text=Sprite" class="whatsapp-btn">Quick Order</a></div></div>
            <div class="card"><div class="image-frame"><img src="images (14).jpeg"></div><div class="card-details"><div class="info-row"><h6>300ml Coke</h6><span class="price-tag">R14.00</span></div><button class="add-cart-btn" onclick="addToCart('300ml Coke',14)">Add to Cart</button><a href="https://wa.me/27790155149?text=300ml Coke" class="whatsapp-btn">Quick Order</a></div></div>
            <div class="card"><div class="image-frame"><img src="images (15).jpeg"></div><div class="card-details"><div class="info-row"><h6>750ml Coke</h6><span class="price-tag">R18.00</span></div><button class="add-cart-btn" onclick="addToCart('750ml Coke',18)">Add to Cart</button><a href="https://wa.me/27790155149?text=750ml Coke" class="whatsapp-btn">Quick Order</a></div></div>
        </div>
    </main>

    <div id="cartOverlay" onclick="toggleCart()"></div>
    <div id="cartDrawer">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;"><h3>Your Cart</h3><i class="fas fa-times" style="cursor:pointer;" onclick="toggleCart()"></i></div>
        <div id="cartItems" style="flex-grow:1; overflow-y:auto;"></div>
        <div style="border-top:1px solid var(--glass-border); padding-top:20px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.2rem;"><span>Total:</span><span id="cartTotal">R0.00</span></div>
            <button onclick="checkout()" style="width:100%; background:#25D366; color:white; border:none; padding:14px; border-radius:12px; font-weight:800; margin-top:15px; cursor:pointer;">Checkout on WhatsApp</button>
            <button onclick="clearCart()" style="width:100%; background:transparent; border:1px solid var(--glass-border); color:var(--text-muted); padding:10px; border-radius:10px; margin-top:10px; cursor:pointer;">Clear Cart</button>
        </div>
    </div>
    <footer><p>&copy; 2026 Campus Bite</p></footer>

<script>
// SIMPLE WORKING CART
let cart = [];
try { cart = JSON.parse(localStorage.getItem('campusCart') || '[]'); } catch(e) { cart = []; }

function save() { localStorage.setItem('campusCart', JSON.stringify(cart)); }

function addToCart(name, price) {
    console.log('Adding', name);
    let found = cart.find(x => x.name === name);
    if (found) found.qty++;
    else cart.push({name: name, price: price, qty: 1});
    save();
    updateUI();
    toggleCart(true);
}

function updateUI() {
    document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0);
    let div = document.getElementById('cartItems');
    let total = 0;
    if (cart.length === 0) {
        div.innerHTML = '<p style="color:#64748b; text-align:center; margin-top:20px;">Cart is empty</p>';
    } else {
        div.innerHTML = '';
        cart.forEach((it, idx) => {
            total += it.price * it.qty;
            div.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><div><b>${it.name}</b><br><small>R${it.price} x ${it.qty}</small></div><div><b style="color:#ffb703;">R${it.price*it.qty}</b> <span onclick="removeItem(${idx})" style="color:red; cursor:pointer; margin-left:10px;">X</span></div></div>`;
        });
    }
    document.getElementById('cartTotal').innerText = 'R' + total + '.00';
}

function removeItem(i) { cart.splice(i,1); save(); updateUI(); }
function clearCart() { cart = []; save(); updateUI(); }
function toggleCart(open) {
    let d = document.getElementById('cartDrawer');
    let o = document.getElementById('cartOverlay');
    if (open === true) { d.classList.add('open'); o.classList.add('open'); }
    else if (open === false) { d.classList.remove('open'); o.classList.remove('open'); }
    else { d.classList.toggle('open'); o.classList.toggle('open'); }
}
function checkout() {
    if (cart.length === 0) { alert('Cart empty'); return; }
    let msg = 'Hi Campus Bite! I want to order:%0A';
    let tot = 0;
    cart.forEach(i => { msg += `- ${i.name} x${i.qty} = R${i.price*i.qty}%0A`; tot += i.price*i.qty; });
    msg += `%0A*Total: R${tot}.00*`;
    window.open('https://wa.me/27790155149?text=' + msg, '_blank');
}

updateUI();
document.getElementById('cartIcon').addEventListener('click', () => toggleCart());
</script>
</body>
</html>
