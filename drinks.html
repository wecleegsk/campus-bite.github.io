<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS BITE | DRINKS</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090b0e;
            --panel-bg: #13171c;
            --accent-gold: #ffb703;
            --accent-gold-hover: #fb8500;
            --text-white: #ffffff;
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Premium Navigation --- */
        header {
            background-color: rgba(19, 23, 28, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-block {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .logo span {
            color: var(--accent-gold);
        }

        .tagline {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a i {
            font-size: 0.95rem;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.03);
        }

        /* --- Premium Subcategory Filter Bar --- */
        .category-bar {
            background: rgba(19, 23, 28, 0.5);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 0;
            display: flex;
            justify-content: center;
        }

        .category-switcher {
            display: flex;
            gap: 12px;
            list-style: none;
        }

        .category-switcher a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 20px;
            border-radius: 99px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s ease;
        }

        .category-switcher a:hover {
            color: var(--text-white);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .category-switcher a.active {
            color: var(--bg-dark);
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.2);
        }

        /* --- Main Layout --- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 24px;
            width: 100%;
            flex-grow: 1;
        }

        .hero-titles {
            text-align: center;
            margin-bottom: 45px;
        }

        .hero-titles h4 {
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .hero-titles h2 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a8b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Menu Grid Configuration --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
        }

        /* --- Premium Card Architecture --- */
        .card {
            background-color: var(--panel-bg);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 183, 3, 0.25);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }

        .image-frame {
            position: relative;
            width: 100%;
            padding-top: 85%; /* Structured card proportions */
            background-color: rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            text-align: left;
        }

        .card-details .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            gap: 8px;
        }

        .card h6 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.2px;
            line-height: 1.3;
        }

        .card .price-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-gold);
            white-space: nowrap;
        }

        /* --- Premium Button Matrix --- */
        .whatsapp-btn {
            margin-top: auto;
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-white);
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }

        .whatsapp-btn i {
            color: #25D366;
            font-size: 1rem;
        }

        .whatsapp-btn:hover {
            background-color: var(--text-white);
            color: var(--bg-dark);
            border-color: var(--text-white);
        }

        .whatsapp-btn:hover i {
            color: var(--bg-dark);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px 24px;
            margin-top: 60px;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 16px;
                padding: 20px;
            }
            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            .hero-titles h2 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
