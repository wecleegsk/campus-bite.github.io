<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS BITE | KOTA MENU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090b0e;
            --panel-bg: #13171c;
            --accent-gold: #ffb703;
            --accent-gold-hover: #fb8500;
            --text-white: #ffffff;
            --text-muted: #64748b;
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- Elegant Glassmorphic Navigation --- */
        header {
            background-color: rgba(19, 23, 28, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-block {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .logo span {
            color: var(--accent-gold);
        }

        .tagline {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.03);
        }

        /* --- Cart Nav Button Badge --- */
        .cart-nav-btn {
            background: rgba(255, 183, 3, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .cart-nav-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }
        .cart-badge {
            background: var(--accent-gold);
            color: var(--bg-dark);
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 50%;
            font-weight: 800;
        }
        .cart-nav-btn:hover .cart-badge {
            background: var(--bg-dark);
            color: var(--accent-gold);
        }

        /* --- Menu Segment Controller --- */
        .menu-toggle-container {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 99px;
            border: 1px solid var(--glass-border);
        }

        .category-btn {
            color: var(--text-muted);
            padding: 8px 24px;
            border-radius: 99px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .category-btn.active {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            box-shadow: 0 4px 12px rgba(255, 183, 3, 0.25);
        }

        /* --- Main Container --- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .hero-titles {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero-titles h4 {
            font-size: 0.9rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .hero-titles h2 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a8b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Modern Bento-Style Grid --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
        }

        /* --- Premium Card Architecture --- */
        .card {
            background-color: var(--panel-bg);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 183, 3, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .image-frame {
            position: relative;
            width: 100%;
            padding-top: 80%; 
            background-color: rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover img {
            transform: scale(1.08);
        }

        /* Price Floating Badge */
        .price-tag {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(9, 11, 14, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--accent-gold);
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 183, 3, 0.25);
            z-index: 2;
        }

        /* Content Context */
        .card-details {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card h6 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.3px;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Add to Cart Button Style */
        .add-cart-btn {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .add-cart-btn:hover {
            background-color: var(--accent-gold-hover);
            box-shadow: 0 6px 16px rgba(255, 183, 3, 0.25);
        }

        /* Minimalistic Action Trigger */
        .whatsapp-btn {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-white);
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .whatsapp-btn i {
            color: #25D366;
            font-size: 1rem;
        }

        .whatsapp-btn:hover {
            background-color: rgba(37, 211, 102, 0.1);
            border-color: rgba(37, 211, 102, 0.3);
        }

        /* --- Slide-Out Cart Drawer Styles --- */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1999;
            display: none;
        }
        .cart-overlay.open {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: var(--panel-bg);
            border-left: 1px solid var(--glass-border);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-white);
        }
        .close-cart-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-cart-btn:hover {
            color: var(--text-white);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-border);
        }
        .cart-item-info h4 {
            font-size: 0.95rem;
            color: var(--text-white);
            margin-bottom: 4px;
        }
        .cart-item-info small {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }
        .cart-item-controls button {
            background: none;
            border: none;
            color: var(--text-white);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .cart-item-controls span {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-gold);
            min-width: 15px;
            text-align: center;
        }

        .cart-footer {
            padding: 24px;
            border-top: 1px solid var(--glass-border);
            background: rgba(9, 11, 14, 0.4);
        }
        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .whatsapp-checkout-btn {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .whatsapp-checkout-btn:hover {
            background: #20ba5a;
            box-shadow: 0 6px 20px rgba(37, 211, 1
