<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Campus Bite</title>
<style>
    * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:#090b0e; color:#fff; font:15px system-ui,sans-serif; }
  .card { width:100%; max-width:380px; background:#12161c; border-radius:16px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .brand { padding:20px 16px 12px; text-align:center; }
  .brand h1 { margin:0; font-size:24px; } .brand h1 span{color:#ffb703;} .brand small{color:#94a3b8; letter-spacing:2px; font-size:11px;}
  .tabs{display:flex; border-bottom:1px solid rgba(255,255,255,.08);}
  .tab{flex:1; padding:12px; background:none; border:none; border-bottom:2px solid transparent; color:#94a3b8; font:inherit; font-weight:600; cursor:pointer;}
  .tab.on{color:#ffb703; border-bottom-color:#ffb703;}
  .body{padding:18px 16px 20px; display:flex; flex-direction:column; gap:12px;}
  .field{position:relative; display:flex; align-items:center;}
  .field .icon{position:absolute; left:12px; width:18px; height:18px; color:#94a3b8; pointer-events:none;}
  .in{width:100%; padding:12px 40px 12px 40px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:#090b0e; color:#fff; font:inherit;}
  .in:focus{outline:2px solid #ffb703;}
  .eye{position:absolute; right:8px; background:none; border:none; cursor:pointer; color:#94a3b8; padding:6px; display:flex;}
  .go{padding:12px; border:none; border-radius:10px; background:#ffb703; color:#090b0e; font:inherit; font-weight:700; cursor:pointer; display:flex; gap:8px; align-items:center; justify-content:center;}
  .msg{min-height:18px; font-size:13px; color:#f87171;} .msg.ok{color:#4ade80;}
  .link{background:none; border:none; color:#94a3b8; font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; text-align:center; margin-top:4px; display:flex; gap:6px; align-items:center; justify-content:center; width:100%;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><h1>CAMPUS <span>BITE</span></h1><small>SATISFY YOUR CRAVINGS</small></div>
  <div id="view"></div>
</div>

<script>
(function () {
  'use strict';
  var LINKS = { menu: 'login.html' };
  var USERS_KEY = 'cb_users';
  var SESSION_KEY = 'cb_session';
  function load(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY))||{} }catch(e){return{}} }
  function save(u){ try{ localStorage.setItem(USERS_KEY, JSON.stringify(u)); return true;}catch(e){return false;} }
  function setSession(k){ try{ if(k) localStorage.setItem(SESSION_KEY,k); else localStorage.removeItem(SESSION_KEY);}catch(e){} }
  function hash(s){
    if(window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.resolve('plain:'+s);
  }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function iconSVG(name){
    var ns='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','1.8'); svg.classList.add('icon');
    var p=document.createElementNS(ns,'path');
    if(name==='user') p.setAttribute('d','M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z');
    if(name==='lock') p.setAttribute('d','M12 15a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M6 10V8a6 6 0 1 1 12 0v2 M5 10h14v10H5z');
    if(name==='eye') p.setAttribute('d','M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z M12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z');
    svg.appendChild(p); return svg;
  }

  var view=document.getElementById('view');

  function renderAuth(mode,note){
    view.textContent='';
    var tabs=el('div','tabs');
    var tLogin=el('button','tab'+(mode==='login'?' on':''),'Login');
    var tSign=el('button','tab'+(mode==='signup'?' on':''),'Sign Up');
    tLogin.type='button'; tSign.type='button';
    tLogin.addEventListener('click',function(){renderAuth('login');});
    tSign.addEventListener('click',function(){renderAuth('signup');});
    tabs.appendChild(tLogin); tabs.appendChild(tSign);

    var form=el('form','body');
    
    var f1=el('div','field'); var u=el('input','in'); u.type='text'; u.placeholder='Username'; f1.appendChild(iconSVG('user')); f1.appendChild(u);
    var f2=el('div','field'); var p=el('input','in'); p.type='password'; p.placeholder=mode==='forgot'?'New Password':'Password'; 
    var eyeBtn=el('button','eye'); eyeBtn.type='button'; eyeBtn.innerHTML='👁️';
    eyeBtn.addEventListener('click',function(){ p.type = p.type==='password' ? 'text':'password'; });
    f2.appendChild(iconSVG('lock')); f2.appendChild(p); f2.appendChild(eyeBtn);

    var msg=el('div','msg'+(note?' ok':''),note||'');
    var go=el('button','go', mode==='login'?'🔓 Login': mode==='signup'?'✨ Create account':'🔑 Reset Password'); go.type='submit';
    
    form.appendChild(f1); form.appendChild(f2); form.appendChild(msg); form.appendChild(go);

    if(mode==='login'){
      var forgot=el('button','link','🔐 Forgot password?'); forgot.type='button';
      forgot.addEventListener('click',function(){renderAuth('forgot');}); form.appendChild(forgot);
    }
    if(mode==='forgot'){
      var back=el('button','link','← Back to login'); back.type='button';
      back.addEventListener('click',function(){renderAuth('login');}); form.appendChild(back);
    }

    view.appendChild(tabs); view.appendChild(form);

    form.addEventListener('submit',function(e){
      e.preventDefault();
      var name=u.value.trim(), pass=p.value;
      if(!name||!pass){msg.textContent='Enter a username and password.'; return;}
      var key=name.toLowerCase(), users=load();
      if(mode==='forgot'){
        if(!users[key]){msg.textContent='Username not found. Please sign up first.'; return;}
        hash(key+':'+pass).then(function(h){ users[key].hash=h; save(users); renderAuth('login','✅ Password reset! Now login.'); });
        return;
      }
      if(mode==='login' && !Object.keys(users).length){msg.textContent='Please sign up first.'; return;}
      hash(key+':'+pass).then(function(h){
        if(mode==='signup'){
          if(users[key]){msg.textContent='That username is already taken.'; return;}
          users[key]={name:name,hash:h}; save(users); setSession(key); window.location.href=LINKS.menu;
        }else{
          if(!users[key]||users[key].hash!==h){msg.textContent='Invalid username or password.'; return;}
          setSession(key); window.location.href=LINKS.menu;
        }
      });
    });
  }
  localStorage.removeItem(SESSION_KEY);
  renderAuth('login');
})();
</script>
</body>
</html>
